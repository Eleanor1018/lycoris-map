name: lycoris-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: lycoris-postgres:17.11-3.6.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: lycoris
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8 --auth-host=scram-sha-256
    secrets:
      - postgres_password
      - app_db_password
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - /opt/lycoris/data/postgres:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-lycoris.sh:ro
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
    mem_limit: 640m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d lycoris']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    restart: unless-stopped
    ports:
      - 127.0.0.1:16379:6379
    command: [redis-server, --appendonly, 'yes', --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes:
      - /opt/lycoris/data/redis:/data
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  app:
    build:
      context: ../..
      target: runtime
      args:
        CARGO_BUILD_JOBS: '1'
    image: ${LYCORIS_APP_IMAGE:-lycoris-backend:ed88782}
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /opt/lycoris/private/app.env
        format: raw
      - path: /opt/lycoris/private/smtp.env
        format: raw
    environment:
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: '18081'
      UPLOAD_DIR: /var/lib/lycoris/uploads
      TRUSTED_PROXIES: 127.0.0.1,::1
      DB_MAX_CONNECTIONS: '10'
      PASSWORD_MAX_CONCURRENCY: '2'
      MEDIA_MAX_CONCURRENCY: '1'
    volumes:
      - /opt/lycoris/data/uploads:/var/lib/lycoris/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/lycoris/data/caddy:/data
      - /opt/lycoris/data/caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

secrets:
  postgres_password:
    file: /opt/lycoris/private/postgres-password
  app_db_password:
    file: /opt/lycoris/private/app-db-password
