[package]
name = "lycoris-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Lycoris Rust 后端（阶段 1：骨架、配置、健康检查与迁移基线）"

[lib]
name = "lycoris_backend"
path = "src/lib.rs"

[[bin]]
name = "lycoris-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout"] }
fred = "10.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
