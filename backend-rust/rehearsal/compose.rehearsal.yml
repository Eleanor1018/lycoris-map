# Lycoris 阶段 4 受控本地演练 compose。
#
# 边界
#   - 项目名、容器、网络、卷、镜像前缀统一 lycoris-rust-rehearsal；
#     绝不对其它项目/容器/卷执行 down/prune/drop，绝不触碰 lycoris-restore-review。
#   - 端口只绑定 127.0.0.1：入口 18180、Rust 18181、Java 18182、PG18 55434、
#     PG17 55435、Redis 56380；现有 18080/5197/55432/55433/56379 不动。
#   - 数据库/Redis 与 Java/Rust 通过本 compose 专用网络用服务名互联（仅网络内部）；
#     主机侧工具只允许回环地址（由 rehearsal/guard.py 强制）。
#   - Rust/Java 各 2 CPU / 512 MiB，PG 各 1 GiB，Redis 128 MiB，用于公平比较。
#   - uploads 使用可追踪的临时目录 bind mount，Java/Rust 共用，保证切换后资源可读。
#
# 依赖：Rust release 镜像与 Java JAR 由其它任务/前置步骤提供；本文件只引用，
# 不构建应用镜像，也不修改应用源码。环境变量见 rehearsal/rehearsal-env.example。

name: lycoris-rust-rehearsal

networks:
  rehearsal:
    name: lycoris-rust-rehearsal-net
    driver: bridge

services:
  pg17:
    image: ${PG17_REHEARSAL_IMAGE:-lycoris-rust-rehearsal-pg17:17.11-postgis3.6.4}
    # 本任务固定基础 digest 并本地构建，避免误从 registry 拉取同名 tag。
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.pg17
      args:
        PG_BASE: ${PG17_REHEARSAL_BASE:-postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0}
        POSTGIS_PKG_VERSION: ${PG17_POSTGIS_PKG_VERSION:-3.6.4+dfsg-2.pgdg12+1}
    container_name: lycoris-rust-rehearsal-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_REHEARSAL_USER:-lycoris_rehearsal}
      POSTGRES_PASSWORD: ${PG_REHEARSAL_PASSWORD:?set PG_REHEARSAL_PASSWORD in the rehearsal .env}
      POSTGRES_DB: lycoris_rehearsal_src
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - lycoris-rust-rehearsal-pg17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_REHEARSAL_USER:-lycoris_rehearsal}", "-d", "lycoris_rehearsal_src"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    cpus: 1.0
    mem_limit: 1g
    networks: [rehearsal]

  pg18:
    image: ${PG18_REHEARSAL_IMAGE:-postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677}
    container_name: lycoris-rust-rehearsal-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_REHEARSAL_USER:-lycoris_rehearsal}
      POSTGRES_PASSWORD: ${PG_REHEARSAL_PASSWORD:?set PG_REHEARSAL_PASSWORD in the rehearsal .env}
      POSTGRES_DB: lycoris_rehearsal_up
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      # PostgreSQL 18 官方镜像要求挂载到 /var/lib/postgresql，数据写入其下 PGDATA 子目录。
      - lycoris-rust-rehearsal-pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_REHEARSAL_USER:-lycoris_rehearsal}", "-d", "lycoris_rehearsal_up"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    cpus: 1.0
    mem_limit: 1g
    networks: [rehearsal]

  redis:
    image: ${REDIS_REHEARSAL_IMAGE:-redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5}
    container_name: lycoris-rust-rehearsal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - lycoris-rust-rehearsal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    cpus: 1.0
    mem_limit: 128m
    networks: [rehearsal]

  nginx:
    image: ${NGINX_REHEARSAL_IMAGE:-nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c}
    container_name: lycoris-rust-rehearsal-nginx
    restart: unless-stopped
    volumes:
      - ${REHEARSAL_WORK_DIR:?set REHEARSAL_WORK_DIR}/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "127.0.0.1:18180:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/rehearsal"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    cpus: 1.0
    mem_limit: 128m
    networks: [rehearsal]

  # Java 21 运行 JAR：只读挂载温晓在原 Java 未改代码构建的平台无关 JAR，
  # ddl-auto=validate，非 root，与 Rust 同 2CPU/512MiB，共用受控上传目录。
  java:
    profiles: ["apps"]
    image: ${JAVA_REHEARSAL_IMAGE:-eclipse-temurin:21-jre@sha256:a80c51f2d09a3e7e00d521f1c817bbceb6b3be94109b4a784d46078099882dda}
    container_name: lycoris-rust-rehearsal-java
    restart: unless-stopped
    user: "${REHEARSAL_APP_UID:-10001}:${REHEARSAL_APP_GID:-10001}"
    command: ["sh", "-c", "exec java -jar /app/app.jar"]
    # 二级密码 BCrypt 哈希含 '$'，经 compose 插值会被破坏；用 env_file 原样传入。
    env_file:
      - ${REHEARSAL_WORK_DIR:?set REHEARSAL_WORK_DIR}/secrets.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      DB_URL: ${JAVA_DB_URL}
      DB_USERNAME: ${PG_REHEARSAL_USER:-lycoris_rehearsal}
      DB_PASSWORD: ${PG_REHEARSAL_PASSWORD:?set PG_REHEARSAL_PASSWORD in the rehearsal .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_SESSION_REDIS_NAMESPACE: ${JAVA_SESSION_NAMESPACE:-lycoris:session:rehearsal:java:g1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: ${REHEARSAL_WEB_ORIGINS:-http://localhost:5198,http://127.0.0.1:5198}
      SESSION_COOKIE_NAME: ${JAVA_SESSION_COOKIE:-LYCORIS_REHEARSAL_JAVA_G1}
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_HTTP_ONLY: "true"
      SESSION_COOKIE_SAME_SITE: lax
      SESSION_TIMEOUT: 30d
      SESSION_COOKIE_MAX_AGE: 30d
      ADMIN_SECOND_FACTOR_ENABLED: "true"
      MARKER_CACHE_REDIS_ENABLED: ${MARKER_CACHE_REDIS_ENABLED:-true}
    volumes:
      - ${JAVA_JAR_PATH:-./missing-java-jar}:/app/app.jar:ro
      - ${REHEARSAL_WORK_DIR:?set REHEARSAL_WORK_DIR}/uploads:/app/uploads
    ports:
      - "127.0.0.1:18182:8080"
    cpus: 2.0
    mem_limit: 512m
    networks: [rehearsal]

  # Rust release 镜像：由另一任务提供；本任务只引用，不构建、不改应用源码。
  rust:
    profiles: ["apps"]
    image: ${RUST_REHEARSAL_IMAGE:-lycoris-rust-rehearsal-rust:local}
    container_name: lycoris-rust-rehearsal-rust
    restart: unless-stopped
    # 与 Java 统一非 root UID/GID 10001，共享受控上传目录（Linux 上同属主可写）。
    user: "${REHEARSAL_APP_UID:-10001}:${REHEARSAL_APP_GID:-10001}"
    # 二级密码 BCrypt 哈希含 '$'；用 env_file 原样传入，避免 compose 插值破坏。
    env_file:
      - ${REHEARSAL_WORK_DIR:?set REHEARSAL_WORK_DIR}/secrets.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RUST_DATABASE_URL}
      REDIS_URL: ${RUST_REDIS_URL:-redis://redis:6379}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
      SESSION_COOKIE_NAME: ${RUST_SESSION_COOKIE:-LYCORIS_REHEARSAL_RUST_G1}
      SESSION_NAMESPACE: ${RUST_SESSION_NAMESPACE:-lycoris:rust:rehearsal:g1}
      MARKER_CACHE_NAMESPACE: ${RUST_MARKER_CACHE_NAMESPACE:-lycoris:rust:rehearsal:marker}
      RATE_LIMIT_NAMESPACE: ${RUST_RATE_LIMIT_NAMESPACE:-lycoris:rust:rehearsal:ratelimit}
      BCRYPT_COST: "10"
      DB_MAX_CONNECTIONS: "10"
      DB_STATEMENT_TIMEOUT_MS: "20000"
      DB_LOCK_TIMEOUT_MS: "5000"
      PASSWORD_MAX_CONCURRENCY: "2"
      MEDIA_MAX_CONCURRENCY: "1"
      ADMIN_SECOND_FACTOR_ENABLED: "true"
      ADMIN_DEFAULT_USER_PASSWORD: ${ADMIN_DEFAULT_USER_PASSWORD:-Lycoris123!}
      CORS_ALLOWED_ORIGINS: ${REHEARSAL_WEB_ORIGINS:-http://localhost:5198,http://127.0.0.1:5198}
      WRITE_ALLOWED_ORIGINS: ${REHEARSAL_WEB_ORIGINS:-http://localhost:5198,http://127.0.0.1:5198}
      MARKER_CACHE_REDIS_ENABLED: ${MARKER_CACHE_REDIS_ENABLED:-true}
      RUST_LOG: info
    volumes:
      - ${REHEARSAL_WORK_DIR:?set REHEARSAL_WORK_DIR}/uploads:/app/uploads
    ports:
      - "127.0.0.1:18181:8080"
    cpus: 2.0
    mem_limit: 512m
    networks: [rehearsal]

volumes:
  lycoris-rust-rehearsal-pg17-data:
    name: lycoris-rust-rehearsal-pg17-data
  lycoris-rust-rehearsal-pg18-data:
    name: lycoris-rust-rehearsal-pg18-data
  lycoris-rust-rehearsal-redis-data:
    name: lycoris-rust-rehearsal-redis-data
