# Lycoris Rust 后端 Linux 发布演练（阶段 4：Linux 发布基础）。
#
# 用途：仅本地演练。构建/运行发布镜像、执行 Linux 测试运行器、验证只读根 + 持久上传卷 +
#       非 root + SIGTERM 与健康检查。**不是**正式生产配置。
#
# 限制：
#   - 端口只绑定回环 127.0.0.1；
#   - 名称/卷/网络前缀统一为 lycoris-rust-release，不操作 roboparty/其它 Docker 项目；
#   - 运行期复用温晓已授权的合成 PostgreSQL(55432)/Redis(56379)，经 host.docker.internal
#     接入，仅用于演练，不得当作生产连接方式；
#   - 绝不连接 lycoris-restore-review、恢复库或任何生产地址。
#
# 常用命令（在 backend-rust/ 内）：
#   docker compose -f compose.release.yml build app
#   docker compose -f compose.release.yml run --rm test
#   docker compose -f compose.release.yml up -d app
#   docker compose -f compose.release.yml run --rm negative   # 期望非零退出
#   docker compose -f compose.release.yml down

name: lycoris-rust-release

# 基础镜像/UID 通过 build args 覆盖；默认固定官方 tag @ 已核对 digest。
# 受限网络下可传入**同一 digest** 的镜像站地址：
#   RUST_BUILDER_IMAGE=docker.m.daocloud.io/library/rust@sha256:ce84a5edd80c…
#   RUNTIME_IMAGE=docker.m.daocloud.io/library/debian@sha256:d7e12182ce18…
x-build-args: &build-args
  RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:-rust:1.98.1-slim-trixie@sha256:ce84a5edd80c5f91e05c5533b1e53eb1da54028f33734dc06aa6b49fa190462d}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132}
  APP_UID: ${APP_UID:-10001}
  APP_GID: ${APP_GID:-10001}

x-app-env: &app-env
  # 合成测试服务地址（仅演练）。生产必须使用受管密钥/内网地址，不得沿用该默认值。
  DATABASE_URL: ${RELEASE_DATABASE_URL:-postgres://lycoris:lycoris_local_test@host.docker.internal:55432/lycoris_rust}
  REDIS_URL: ${RELEASE_REDIS_URL:-redis://host.docker.internal:56379}
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "18081"
  UPLOAD_DIR: /var/lib/lycoris/uploads
  TMPDIR: /tmp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *build-args
    image: lycoris-rust-release-app:local
    container_name: lycoris-rust-release
    restart: "no"
    ports:
      - "127.0.0.1:${RELEASE_HTTP_PORT:-18091}:18081"
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 只读根 + 受限 tmpfs + 去掉全部 capability + 禁止提权。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # 上传目录持久化；命名卷首次挂载会继承镜像内目录的 10001:10001 属主。
      - lycoris-rust-release-uploads:/var/lib/lycoris/uploads
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/lycoris-backend", "--healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    networks:
      - lycoris-rust-release-net

  # 负向演练：只读根且上传目录不可创建，启动必须失败（非零退出）。用于证明失败可见。
  negative:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        <<: *build-args
    image: lycoris-rust-release-negative:local
    container_name: lycoris-rust-release-negative
    restart: "no"
    environment:
      <<: *app-env
      UPLOAD_DIR: /var/lib/lycoris/readonly-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - lycoris-rust-release-net

  # 独立测试运行器：真实 Linux 上跑 fmt/clippy/离线 SQLx 全 targets 编译/全部 cargo test。
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        <<: *build-args
    image: lycoris-rust-release-test:local
    environment:
      # 并发参数只接受 1..2（运行器脚本拒绝 0/非法/超出）；上游与监听由脚本与转发器固定，
      # 不透传可覆写的环境变量，避免通过环回转发绕过 tests/common 的回环/合成库 guard。
      RUST_TEST_THREADS: "2"
      CARGO_BUILD_JOBS: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 本项目专用增量编译缓存（前缀 lycoris-rust-release），不与其它工作树共享 target/registry，
      # 也不从外部 target 复制产物；复跑通过增量编译复用。
      - lycoris-rust-release-test-target:/app/target
      - lycoris-rust-release-test-cargo-registry:/usr/local/cargo/registry
    networks:
      - lycoris-rust-release-net

networks:
  lycoris-rust-release-net:
    name: lycoris-rust-release-net

volumes:
  lycoris-rust-release-uploads:
    name: lycoris-rust-release-uploads
  # 本项目专用增量编译缓存；仅本任务容器使用，不共享其它工作树目标。
  lycoris-rust-release-test-target:
    name: lycoris-rust-release-test-target
  lycoris-rust-release-test-cargo-registry:
    name: lycoris-rust-release-test-cargo-registry
